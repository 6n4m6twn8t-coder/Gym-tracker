<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Leg press movement demo">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b0d11"/><stop offset="1" stop-color="#11151c"/></linearGradient>
  <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f4f6f8"/><stop offset=".42" stop-color="#bac2cc"/><stop offset="1" stop-color="#707a86"/></linearGradient>
  <linearGradient id="metalRear" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#aeb7c2"/><stop offset="1" stop-color="#69737f"/></linearGradient>
  <linearGradient id="darkmetal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#59626f"/><stop offset="1" stop-color="#242b34"/></linearGradient>
  <linearGradient id="quad" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ff7061"/><stop offset="1" stop-color="#e34739"/></linearGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5"/></filter>
</defs>
<rect width="640" height="360" rx="28" fill="url(#bg)"/>
<text x="26" y="34" fill="#aeb6c1" font-family="system-ui,-apple-system,sans-serif" font-weight="800" font-size="18" letter-spacing="1.4">LEG PRESS</text>
<line x1="26" y1="48" x2="614" y2="48" stroke="#242a32"/>

<!-- machine -->
<path d="M444 316 L578 72" stroke="#3b4450" stroke-width="18" stroke-linecap="round"/>
<path d="M459 320 L593 76" stroke="#171c22" stroke-width="6" stroke-linecap="round"/>
<path d="M400 322 H606" stroke="#3b4450" stroke-width="12" stroke-linecap="round"/>
<path d="M220 318 H395" stroke="#3b4450" stroke-width="13" stroke-linecap="round"/>
<path d="M244 303 L313 211" stroke="#4d5763" stroke-width="23" stroke-linecap="round"/>
<path d="M236 297 L306 204" stroke="#181e25" stroke-width="13" stroke-linecap="round"/>
<path d="M279 248 L336 282" stroke="#252c35" stroke-width="30" stroke-linecap="round"/>
<path d="M302 216 L353 248" stroke="#343c47" stroke-width="10" stroke-linecap="round" opacity=".9"/>

<!-- sled -->
<g>
  <rect x="486" y="92" width="96" height="135" rx="12" fill="url(#darkmetal)" stroke="#6b7684" stroke-width="5" transform="rotate(18 534 160)"/>
  <g stroke="#75808d" stroke-width="2" opacity=".65"><line x1="510" y1="116" x2="565" y2="132"/><line x1="504" y1="139" x2="559" y2="155"/><line x1="498" y1="162" x2="553" y2="178"/><line x1="492" y1="185" x2="547" y2="201"/></g>
  <animateTransform attributeName="transform" type="translate" values="0 0;42 -46;42 -46;0 0" keyTimes="0;.45;.58;1" dur="3.6s" repeatCount="indefinite" calcMode="spline" keySplines=".42 0 .2 1;.42 0 .2 1;.42 0 .2 1"/>
</g>

<ellipse cx="340" cy="309" rx="122" ry="15" fill="#000" opacity=".25" filter="url(#shadow)"/>

<!-- fixed torso seated into pad -->
<path d="M311 205 C292 192 278 174 279 154 C280 137 291 126 306 127 C329 128 349 145 355 166 C359 182 352 199 338 214 L330 228 L312 224 Z" fill="url(#metal)" stroke="#59626e" stroke-width="3"/>
<path d="M300 147 C292 159 293 180 307 199" fill="none" stroke="#e7ebef" stroke-width="3" opacity=".45"/>
<ellipse cx="294" cy="119" rx="21" ry="25" fill="url(#metal)" stroke="#59626e" stroke-width="3" transform="rotate(-21 294 119)"/>
<path d="M320 183 C301 203 286 225 272 248" fill="none" stroke="#c3cad2" stroke-width="17" stroke-linecap="round"/>
<path d="M332 187 C319 205 311 225 307 245" fill="none" stroke="#929ca8" stroke-width="14" stroke-linecap="round"/>
<circle cx="271" cy="249" r="8" fill="#9aa4b0"/>
<ellipse cx="324" cy="226" rx="17" ry="13" fill="#858f9b" stroke="#59626e" stroke-width="2"/>

<!-- rear leg -->
<path d="M326 226 C352 226 378 220 403 205" fill="none" stroke="url(#metalRear)" stroke-width="28" stroke-linecap="round">
 <animate attributeName="d" values="M326 226 C352 226 378 220 403 205;M326 226 C358 216 394 195 431 169;M326 226 C358 216 394 195 431 169;M326 226 C352 226 378 220 403 205" keyTimes="0;.45;.58;1" dur="3.6s" repeatCount="indefinite" calcMode="spline" keySplines=".42 0 .2 1;.42 0 .2 1;.42 0 .2 1"/>
