<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Leg press movement demo">
<defs>
  <linearGradient id="body" x1="0" x2="1"><stop offset="0" stop-color="#68707c"/><stop offset=".5" stop-color="#c5cad1"/><stop offset="1" stop-color="#5f6672"/></linearGradient>
  <linearGradient id="limb" x1="0" x2="1"><stop offset="0" stop-color="#858d99"/><stop offset=".55" stop-color="#d2d6dc"/><stop offset="1" stop-color="#747c88"/></linearGradient>
  <linearGradient id="metal" x1="0" x2="1"><stop offset="0" stop-color="#353b45"/><stop offset=".5" stop-color="#59616d"/><stop offset="1" stop-color="#2e343d"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity=".35"/></filter>
</defs>
<rect width="640" height="360" rx="28" fill="#0b0d11"/>
<g opacity=".35" stroke="#242932"><line x1="40" y1="300" x2="600" y2="300"/><line x1="40" y1="60" x2="600" y2="60"/></g>
<g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" fill="#a9b0bb"><text x="48" y="48" font-size="18" font-weight="700">LEG PRESS</text><text x="48" y="326" font-size="14">Lower under control • Drive through the whole foot</text></g>

<!-- machine -->
<g filter="url(#shadow)">
  <path d="M172 292 L306 292" stroke="#404650" stroke-width="16" stroke-linecap="round"/>
  <path d="M196 282 L287 181" stroke="#505865" stroke-width="18" stroke-linecap="round"/>
  <path d="M278 183 L326 142" stroke="#59616d" stroke-width="12" stroke-linecap="round"/>
  <rect x="437" y="72" width="22" height="216" rx="10" transform="rotate(16 448 180)" fill="url(#metal)"/>
  <rect x="454" y="83" width="104" height="189" rx="16" transform="rotate(16 506 178)" fill="#2e343d" stroke="#666f7d" stroke-width="4"/>
  <path d="M477 109 L532 125 M468 144 L523 160 M458 180 L513 196 M448 216 L503 232" stroke="#3f4651" stroke-width="3" opacity=".8"/>
</g>

<!-- athlete torso and head -->
<g stroke-linecap="round" stroke-linejoin="round" filter="url(#shadow)">
  <ellipse cx="307" cy="146" rx="20" ry="22" fill="url(#body)" stroke="#3b414a" stroke-width="2"/>
  <path d="M292 164 Q274 179 262 199 Q254 211 247 221" stroke="url(#body)" stroke-width="30" fill="none"/>
  <path d="M281 173 Q266 188 255 207" stroke="#e2e5e9" stroke-opacity=".22" stroke-width="2" fill="none"/>
  <path d="M250 219 L221 255" stroke="url(#body)" stroke-width="23"/>
  <path d="M221 255 L196 287" stroke="url(#body)" stroke-width="17"/>
  <path d="M271 189 Q285 199 299 207" stroke="#8e96a2" stroke-width="14"/>
</g>

<!-- animated legs -->
<g stroke-linecap="round" stroke-linejoin="round" filter="url(#shadow)">
  <g>
    <path d="M252 216 L329 232 L396 180" stroke="url(#limb)" stroke-width="24" fill="none">
      <animate attributeName="d" values="M252 216 L329 232 L396 180;M252 216 L360 220 L435 176;M252 216 L329 232 L396 180" dur="3s" calcMode="spline" keySplines=".42 0 .58 1;.42 0 .58 1" repeatCount="indefinite"/>
    </path>
    <path d="M254 224 L329 249 L399 198" stroke="url(#limb)" stroke-width="24" fill="none">
      <animate attributeName="d" values="M254 224 L329 249 L399 198;M254 224 L360 238 L438 193;M254 224 L329 249 L399 198" dur="3s" calcMode="spline" keySplines=".42 0 .58 1;.42 0 .58 1" repeatCount="indefinite"/>
    </path>
  </g>
  <g fill="#ef5a4c" stroke="#3a1b18" stroke-width="2">
    <ellipse cx="319" cy="230" rx="17" ry="10" transform="rotate(10 319 230)">
      <animate attributeName="cx" values="319;350;319" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="230;219;230" dur="3s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="320" cy="247" rx="17" ry="10" transform="rotate(12 320 247)">
      <animate attributeName="cx" values="320;350;320" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="247;236;247" dur="3s" repeatCount="indefinite"/>
    </ellipse>
  </g>
  <g fill="#cbd1d8" stroke="#535a65" stroke-width="2">
    <ellipse cx="396" cy="180" rx="13" ry="7" transform="rotate(-20 396 180)">
      <animate attributeName="cx" values="396;435;396" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="180;176;180" dur="3s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="399" cy="198" rx="13" ry="7" transform="rotate(-20 399 198)">
      <animate attributeName="cx" values="399;438;399" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="198;193;198" dur="3s" repeatCount="indefinite"/>
    </ellipse>
  </g>
</g>

<!-- target cue -->
<g fill="none" stroke="#ef5a4c" stroke-width="4" opacity=".85">
  <path d="M303 218 Q323 225 342 219"/>
  <path d="M302 239 Q323 247 343 238"/>
</g>
</svg>