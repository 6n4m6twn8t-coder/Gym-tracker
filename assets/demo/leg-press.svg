<path d="M403 205 C431 193 451 177 470 158" fill="none" stroke="#78838f" stroke-width="23" stroke-linecap="round">
 <animate attributeName="d" values="M403 205 C431 193 451 177 470 158;M431 169 C463 153 491 133 522 111;M431 169 C463 153 491 133 522 111;M403 205 C431 193 451 177 470 158" keyTimes="0;.45;.58;1" dur="3.6s" repeatCount="indefinite" calcMode="spline" keySplines=".42 0 .2 1;.42 0 .2 1;.42 0 .2 1"/>
</path>

<!-- front thigh -->
<path d="M323 229 C348 231 374 225 398 211" fill="none" stroke="url(#metal)" stroke-width="32" stroke-linecap="round">
 <animate attributeName="d" values="M323 229 C348 231 374 225 398 211;M323 229 C356 218 391 198 425 174;M323 229 C356 218 391 198 425 174;M323 229 C348 231 374 225 398 211" keyTimes="0;.45;.58;1" dur="3.6s" repeatCount="indefinite" calcMode="spline" keySplines=".42 0 .2 1;.42 0 .2 1;.42 0 .2 1"/>
