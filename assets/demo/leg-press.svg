<!-- quad muscle overlay -->
<path d="M332 228 C351 229 370 225 389 214" fill="none" stroke="url(#quad)" stroke-width="13" stroke-linecap="round" opacity=".98">
 <animate attributeName="d" values="M332 228 C351 229 370 225 389 214;M332 228 C357 217 385 201 414 181;M332 228 C357 217 385 201 414 181;M332 228 C351 229 370 225 389 214" keyTimes="0;.45;.58;1" dur="3.6s" repeatCount="indefinite" calcMode="spline" keySplines=".42 0 .2 1;.42 0 .2 1;.42 0 .2 1"/>
</path>

<!-- knee joint -->
<ellipse cx="398" cy="211" rx="9" ry="8" fill="#d9dee4" stroke="#69737f" stroke-width="2">
 <animate attributeName="cx" values="398;425;425;398" keyTimes="0;.45;.58;1" dur="3.6s" repeatCount="indefinite"/>
 <animate attributeName="cy" values="211;174;174;211" keyTimes="0;.45;.58;1" dur="3.6s" repeatCount="indefinite"/>
</ellipse>

<!-- shoes: broader sole, planted on sled -->
<path d="M463 160 C475 155 485 150 494 143 L507 150 C498 158 485 166 470 171 Z" fill="#e6e9ed" stroke="#737d89" stroke-width="2">
 <animate attributeName="d" values="M463 160 C475 155 485 150 494 143 L507 150 C498 158 485 166 470 171 Z;M514 115 C526 109 537 104 546 97 L559 104 C549 113 536 121 521 126 Z;M514 115 C526 109 537 104 546 97 L559 104 C549 113 536 121 521 126 Z;M463 160 C475 155 485 150 494 143 L507 150 C498 158 485 166 470 171 Z" keyTimes="0;.45;.58;1" dur="3.6s" repeatCount="indefinite" calcMode="spline" keySplines=".42 0 .2 1;.42 0 .2 1;.42 0 .2 1"/>
</path>
<path d="M469 170 C481 165 491 160 500 153 L512 160 C503 169 491 176 476 181 Z" fill="#c2c9d1" stroke="#69737f" stroke-width="2">
 <animate attributeName="d" values="M469 170 C481 165 491 160 500 153 L512 160 C503 169 491 176 476 181 Z;M521 125 C533 119 543 114 552 107 L564 114 C555 123 543 131 528 136 Z;M521 125 C533 119 543 114 552 107 L564 114 C555 123 543 131 528 136 Z;M469 170 C481 165 491 160 500 153 L512 160 C503 169 491 176 476 181 Z" keyTimes="0;.45;.58;1" dur="3.6s" repeatCount="indefinite" calcMode="spline" keySplines=".42 0 .2 1;.42 0 .2 1;.42 0 .2 1"/>
</path>

<text x="26" y="334" fill="#9ca5b1" font-family="system-ui,-apple-system,sans-serif" font-size="15">Lower under control • Drive through the whole foot</text>
</svg>