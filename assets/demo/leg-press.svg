<!-- front shin -->
<path d="M398 211 C425 198 447 180 466 162" fill="none" stroke="url(#metal)" stroke-width="26" stroke-linecap="round">
 <animate attributeName="d" values="M398 211 C425 198 447 180 466 162;M425 174 C458 156 487 136 517 116;M425 174 C458 156 487 136 517 116;M398 211 C425 198 447 180 466 162" keyTimes="0;.45;.58;1" dur="3.6s" repeatCount="indefinite" calcMode="spline" keySplines=".42 0 .2 1;.42 0 .2 1;.42 0 .2 1"/>
