<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Leg press movement demo">
<defs>
  <linearGradient id="body" x1="0" x2="1"><stop offset="0" stop-color="#5f6671"/><stop offset=".5" stop-color="#c8cdd4"/><stop offset="1" stop-color="#555d68"/></linearGradient>
  <linearGradient id="limb" x1="0" x2="1"><stop offset="0" stop-color="#737b87"/><stop offset=".52" stop-color="#d6dae0"/><stop offset="1" stop-color="#69717d"/></linearGradient>
  <linearGradient id="metal" x1="0" x2="1"><stop offset="0" stop-color="#323842"/><stop offset=".5" stop-color="#59616d"/><stop offset="1" stop-color="#292f38"/></linearGradient>
  <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity=".38"/></filter>
</defs>
<rect width="640" height="360" rx="28" fill="#0b0d11"/>
<g opacity=".35" stroke="#242932"><line x1="40" y1="300" x2="600" y2="300"/><line x1="40" y1="60" x2="600" y2="60"/></g>
<g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" fill="#a9b0bb"><text x="48" y="48" font-size="18" font-weight="700">LEG PRESS</text><text x="48" y="326" font-size="14">Lower under control • Drive through the whole foot</text></g>

<!-- machine -->
<g filter="url(#shadow)">
  <path d="M172 292 L306 292" stroke="#404650" stroke-width="16" stroke-linecap="round"/>
  <path d="M196 282 L287 181" stroke="#505865" stroke-width="18" stroke-linecap="round"/>
  <path d="M278 183 L326 142" stroke="#59616d" stroke-width="12" stroke-linecap="round"/>
  <rect x="438" y="72" width="22" height="216" rx="10" transform="rotate(16 449 180)" fill="url(#metal)"/>
  <rect x="455" y="82" width="106" height="190" rx="16" transform="rotate(16 508 177)" fill="#2e343d" stroke="#6b7481" stroke-width="4"/>
  <path d="M477 109 L535 126 M468 144 L526 161 M458 180 L516 197 M448 216 L506 233" stroke="#414853" stroke-width="3" opacity=".85"/>
</g>

<!-- athlete body anchored to pad -->
<g stroke-linecap="round" stroke-linejoin="round" filter="url(#shadow)">
  <ellipse cx="306" cy="147" rx="19" ry="21" fill="url(#body)" stroke="#3a4049" stroke-width="2"/>
  <path d="M291 165 Q273 181 261 201 Q253 213 247 221" stroke="url(#body)" stroke-width="31" fill="none"/>
  <path d="M280 173 Q266 189 255 208" stroke="#eef1f4" stroke-opacity=".18" stroke-width="2" fill="none"/>
  <path d="M249 220 L223 254" stroke="url(#body)" stroke-width="22"/>
  <path d="M223 254 L198 287" stroke="url(#body)" stroke-width="16"/>
  <path d="M271 189 Q285 198 299 207" stroke="#8b939f" stroke-width="14"/>
  <path d="M261 211 Q267 220 276 226" stroke="#ef5a4c" stroke-opacity=".58" stroke-width="8"/>
</g>

<!-- animated hips / thighs / shins -->
<g stroke-linecap="round" stroke-linejoin="round" filter="url(#shadow)">
  <!-- rear leg -->
  <path d="M252 216 L329 232" stroke="url(#limb)" stroke-width="27" fill="none">
    <animate attributeName="d" values="M252 216 L329 232;M252 216 L360 220;M252 216 L329 232" dur="3s" calcMode="spline" keySplines=".42 0 .58 1;.42 0 .58 1" repeatCount="indefinite"/>
  </path>
  <path d="M329 232 L396 180" stroke="url(#limb)" stroke-width="23" fill="none">
    <animate attributeName="d" values="M329 232 L396 180;M360 220 L435 176;M329 232 L396 180" dur="3s" calcMode="spline" keySplines=".42 0 .58 1;.42 0 .58 1" repeatCount="indefinite"/>
  </path>
  <!-- front leg -->
  <path d="M254 224 L329 249" stroke="url(#limb)" stroke-width="27" fill="none">
    <animate attributeName="d" values="M254 224 L329 249;M254 224 L360 238;M254 224 L329 249" dur="3s" calcMode="spline" keySplines=".42 0 .58 1;.42 0 .58 1" repeatCount="indefinite"/>
  </path>
  <path d="M329 249 L399 198" stroke="url(#limb)" stroke-width="23" fill="none">
    <animate attributeName="d" values="M329 249 L399 198;M360 238 L438 193;M329 249 L399 198" dur="3s" calcMode="spline" keySplines=".42 0 .58 1;.42 0 .58 1" repeatCount="indefinite"/>
  </path>

  <!-- quad highlights that travel with thigh segments -->
  <path d="M273 220 Q301 224 322 230" stroke="#ef5a4c" stroke-width="8" opacity=".9" fill="none">
    <animate attributeName="d" values="M273 220 Q301 224 322 230;M273 220 Q315 219 349 220;M273 220 Q301 224 322 230" dur="3s" repeatCount="indefinite"/>
  </path>
  <path d="M275 228 Q301 235 322 246" stroke="#ef5a4c" stroke-width="8" opacity=".78" fill="none">
    <animate attributeName="d" values="M275 228 Q301 235 322 246;M275 228 Q317 231 350 238;M275 228 Q301 235 322 246" dur="3s" repeatCount="indefinite"/>
  </path>

  <!-- connected shoes / full-foot contact -->
  <g fill="#d8dde3" stroke="#555d67" stroke-width="2">
    <path d="M389 173 q12 -6 21 1 l10 6 q3 2 1 6 q-2 4 -7 3 l-18 -3 q-10 -2 -13 -7 q-2 -4 6 -6z">
      <animate attributeName="d" values="M389 173 q12 -6 21 1 l10 6 q3 2 1 6 q-2 4 -7 3 l-18 -3 q-10 -2 -13 -7 q-2 -4 6 -6z;M428 169 q12 -6 21 1 l10 6 q3 2 1 6 q-2 4 -7 3 l-18 -3 q-10 -2 -13 -7 q-2 -4 6 -6z;M389 173 q12 -6 21 1 l10 6 q3 2 1 6 q-2 4 -7 3 l-18 -3 q-10 -2 -13 -7 q-2 -4 6 -6z" dur="3s" repeatCount="indefinite"/>
    </path>
    <path d="M392 191 q12 -6 21 1 l10 6 q3 2 1 6 q-2 4 -7 3 l-18 -3 q-10 -2 -13 -7 q-2 -4 6 -6z">
      <animate attributeName="d" values="M392 191 q12 -6 21 1 l10 6 q3 2 1 6 q-2 4 -7 3 l-18 -3 q-10 -2 -13 -7 q-2 -4 6 -6z;M431 186 q12 -6 21 1 l10 6 q3 2 1 6 q-2 4 -7 3 l-18 -3 q-10 -2 -13 -7 q-2 -4 6 -6z;M392 191 q12 -6 21 1 l10 6 q3 2 1 6 q-2 4 -7 3 l-18 -3 q-10 -2 -13 -7 q-2 -4 6 -6z" dur="3s" repeatCount="indefinite"/>
    </path>
  </g>
</g>

<!-- subtle knee tracking cue, not knee highlight -->
<g fill="none" stroke="#ef5a4c" stroke-width="2.5" opacity=".45"><path d="M327 232 q8 3 14 0"/><path d="M327 249 q8 3 14 0"/></g>
</svg>