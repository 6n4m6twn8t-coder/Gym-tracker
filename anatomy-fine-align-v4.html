<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Project Athlete — Fine Alignment V4</title><style>:root{color-scheme:dark;--bg:#07090c;--panel:#11151b;--line:#292f38;--text:#f2efe8;--muted:#9aa1aa;--gold:#d7b75d;--cyan:#25e6ff}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{padding:calc(12px + env(safe-area-inset-top)) 12px calc(22px + env(safe-area-inset-bottom))}.wrap{max-width:540px;margin:auto}h1{font-size:21px;margin:0 0 5px}.sub{font-size:12px;line-height:1.4;color:var(--muted);margin:0 0 10px}.stage{position:relative;width:100%;aspect-ratio:2/3;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:#d7d7d7}.stage>*{position:absolute;inset:0;width:100%;height:100%}#detailWrap{z-index:2;transform-origin:center}#detail{width:100%;height:100%;object-fit:contain;display:block}#goldSvg{z-index:1;pointer-events:none}#mapSvg{z-index:3;pointer-events:none}.map-line{fill:none;stroke:var(--cyan);stroke-width:1.6;stroke-opacity:.78;vector-effect:non-scaling-stroke}.outline-line{fill:none;stroke:var(--cyan);stroke-width:2.4;stroke-opacity:.95;vector-effect:non-scaling-stroke}.gold{fill:#d7b75d;fill-opacity:.9}.panel{margin-top:10px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.control{margin-top:10px}label{display:flex;justify-content:space-between;font-size:12px;color:#bcc2c9;margin-bottom:5px}.value{color:var(--gold);font-variant-numeric:tabular-nums}input[type=range]{width:100%;accent-color:var(--gold)}button{border:1px solid #3a414c;background:#181d24;color:var(--text);border-radius:11px;padding:10px;font-weight:700}button.active{border-color:#7d6933;background:#211c10;color:#ead17a}.readout{margin-top:10px;padding:9px 10px;border-radius:10px;background:#0b0e12;border:1px solid #222831;font:12px ui-monospace,SFMono-Regular,Menlo,monospace;color:#c8cdd3}.status{position:absolute;z-index:5;left:12px;top:12px;padding:7px 9px;border-radius:9px;background:rgba(7,9,12,.82);font-size:11px}.ok{color:#a9e7b0}.err{color:#ff9c9c}</style></head><body><div class="wrap"><h1>Fine alignment V4</h1><p class="sub">Cyan = exact MuscleMap geometry. Gold = exact chest paths. Move only the detailed body.</p><div class="stage"><svg id="goldSvg" viewBox="0 0 1024 1536" preserveAspectRatio="xMidYMid meet"></svg><div id="detailWrap"><img id="detail" src="assets/anatomy-detail-front-fit-256.webp?v=4" alt="Detailed anatomy body"></div><svg id="mapSvg" viewBox="0 0 1024 1536" preserveAspectRatio="xMidYMid meet"><g id="mapLines"></g></svg><div id="status" class="status">Loading detailed body…</div></div><div class="panel"><div class="grid"><button id="mapBtn" class="active">Map ON</button><button id="goldBtn" class="active">Gold ON</button></div><div class="control"><label><span>X position</span><span id="xv" class="value">0 px</span></label><input id="x" type="range" min="-100" max="100" step="1" value="0"></div><div class="control"><label><span>Y position</span><span id="yv" class="value">0 px</span></label><input id="y" type="range" min="-100" max="100" step="1" value="0"></div><div class="control"><label><span>Overall scale</span><span id="sv" class="value">1.000</span></label><input id="scale" type="range" min="0.800" max="1.200" step="0.001" value="1"></div><div class="control"><label><span>Width</span><span id="wv" class="value">1.000</span></label><input id="width" type="range" min="0.800" max="1.200" step="0.001" value="1"></div><div class="control"><label><span>Height</span><span id="hv" class="value">1.000</span></label><input id="height" type="range" min="0.800" max="1.200" step="0.001" value="1"></div><div class="control"><label><span>Detail opacity</span><span id="ov" class="value">85%</span></label><input id="opacity" type="range" min="25" max="100" step="1" value="85"></div><div class="control"><label><span>Map opacity</span><span id="mv" class="value">78%</span></label><input id="mapOpacity" type="range" min="10" max="100" step="1" value="78"></div><div class="grid" style="margin-top:10px"><button id="resetBtn">Reset</button><button id="copyBtn">Copy values</button></div><div id="readout" class="readout">x:0 y:0 scale:1.000 width:1.000 height:1.000</div></div></div><script type="module">import{MALE_FRONT}from'https://esm.sh/@musclemap/assets@1.0.1?bundle';const NS='http://www.w3.org/2000/svg',el=id=>document.getElementById(id),mapLines=el('mapLines'),goldSvg=el('goldSvg'),detail=el('detail'),status=el('status'),mirror=()=>`translate(${2*MALE_FRONT.centerX} 0) scale(-1 1)`;function add(parent,d,cls,tr=''){const p=document.createElementNS(NS,'path');p.setAttribute('d',d);p.setAttribute('class',cls);if(tr)p.setAttribute('transform',tr);parent.appendChild(p)}for(const o of MALE_FRONT.outline){add(mapLines,o.d,'outline-line');if(o.side==='LEFT')add(mapLines,o.d,'outline-line',mirror())}for(const m of MALE_FRONT.muscles){add(mapLines,m.d,'map-line');if(m.side==='LEFT')add(mapLines,m.d,'map-line',mirror());if(m.group==='CHEST'||String(m.id||'').startsWith('CHEST_')){add(goldSvg,m.d,'gold');if(m.side==='LEFT')add(goldSvg,m.d,'gold',mirror())}}detail.addEventListener('load',()=>{status.textContent='Detailed body loaded ✓';status.className='status ok';setTimeout(()=>status.style.display='none',1200)});detail.addEventListener('error',()=>{status.textContent='Detailed body failed to load';status.className='status err'});const wrap=el('detailWrap'),x=el('x'),y=el('y'),scale=el('scale'),width=el('width'),height=el('height'),opacity=el('opacity'),mapOpacity=el('mapOpacity');function apply(){const xv=+x.value,yv=+y.value,s=+scale.value,sx=+width.value,sy=+height.value;wrap.style.transform=`translate(${xv}px,${yv}px) scale(${s*sx},${s*sy})`;detail.style.opacity=+opacity.value/100;mapLines.style.opacity=+mapOpacity.value/100;el('xv').textContent=`${xv} px`;el('yv').textContent=`${yv} px`;el('sv').textContent=s.toFixed(3);el('wv').textContent=sx.toFixed(3);el('hv').textContent=sy.toFixed(3);el('ov').textContent=`${opacity.value}%`;el('mv').textContent=`${mapOpacity.value}%`;el('readout').textContent=`x:${xv} y:${yv} scale:${s.toFixed(3)} width:${sx.toFixed(3)} height:${sy.toFixed(3)}`} [x,y,scale,width,height,opacity,mapOpacity].forEach(n=>n.addEventListener('input',apply));let mapOn=true,goldOn=true;el('mapBtn').onclick=()=>{mapOn=!mapOn;el('mapSvg').style.display=mapOn?'block':'none';el('mapBtn').classList.toggle('active',mapOn);el('mapBtn').textContent=`Map ${mapOn?'ON':'OFF'}`};el('goldBtn').onclick=()=>{goldOn=!goldOn;goldSvg.style.display=goldOn?'block':'none';el('goldBtn').classList.toggle('active',goldOn);el('goldBtn').textContent=`Gold ${goldOn?'ON':'OFF'}`};el('resetBtn').onclick=()=>{x.value=0;y.value=0;scale.value=1;width.value=1;height.value=1;opacity.value=85;mapOpacity.value=78;apply()};el('copyBtn').onclick=async()=>{try{await navigator.clipboard.writeText(el('readout').textContent);el('copyBtn').textContent='Copied ✓'}catch{el('copyBtn').textContent='Screenshot values'}};apply();</script></body></html>
