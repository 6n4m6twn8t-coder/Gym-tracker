<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Project Athlete — Curved Fibre V9</title>
<style>
:root{color-scheme:dark}html,body{margin:0;background:#07090c;color:#f2efe8;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.loading{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}.loading div{max-width:420px}.loading b{display:block;font-size:20px;margin-bottom:8px}.loading span{color:#9aa1aa;font-size:13px}
</style>
</head>
<body>
<div class="loading"><div><b>Loading V9 fibre pass…</b><span>V7/V8 geometry remains locked. Curved muscle-specific fibres are generated only inside the exact SVG containers.</span></div></div>
<script>
(async()=>{
  try{
    const r=await fetch('./anatomy-muscle-texture-v7.html?v=locked-v7-fibre-base');
    if(!r.ok) throw new Error('Could not load locked V7 base');
    let h=await r.text();
    const rep=(a,b)=>{if(!h.includes(a))console.warn('V9 replacement missed:',a.slice(0,80));h=h.replace(a,b)};

    rep('Project Athlete — Exact Muscle Detail V7','Project Athlete — Curved Fibre V9');
    rep('Exact muscle detail V7','Curved anatomical fibre V9');
    rep(
      'V6 geometry is locked. This version changes only the surface: exact SVG muscle volume plus mid-frequency ridges and fine texture extracted from the detailed render.',
      'Exact SVG geometry stays locked. V9 adds curved, muscle-specific fibre flow, subtle grooves and irregular micro-texture inside each container — no straight-line overlay and no boundary changes.'
    );
    rep('V6 SHAPES LOCKED','SHAPES LOCKED');
    rep('MULTI-BAND DETAIL','CURVED FIBRE FLOW');
    rep('grid-template-columns:repeat(3,1fr)','grid-template-columns:repeat(2,1fr)');
    rep(
      '<div class="grid"><button id="detailBtn" class="active">Detail ON</button><button id="mapBtn" class="active">Map ON</button><button id="goldBtn" class="active">Gold ON</button></div>',
      '<div class="grid"><button id="detailBtn" class="active">Detail ON</button><button id="fibreBtn" class="active">Fibres ON</button><button id="mapBtn" class="active">Map ON</button><button id="goldBtn" class="active">Gold ON</button></div>'
    );
    rep(
      'Detail OFF shows the smooth V6-style generated muscle surface. Detail ON adds only source-derived ridges and fine texture. Exact muscle boundaries do not move.',
      'Detail controls the V8-style source texture. Fibres controls V9 curved procedural fibre flow. Both stay clipped to the exact SVG muscle shapes.'
    );
    rep(
      'let img=null,detailOn=true,mapOn=true,goldOn=true,sourceCanvas=null,midMap=null,fineMap=null,microMap=null;',
      'let img=null,detailOn=true,fibreOn=true,mapOn=true,goldOn=true,sourceCanvas=null,midMap=null,fineMap=null,microMap=null;'
    );
    rep(
      "function isChest(m){const s=(String(m.group||'')+' '+String(m.id||'')).toUpperCase();return s.includes('CHEST')}",
      `function muscleName(m){return (String(m.group||'')+' '+String(m.id||'')).toUpperCase()}
function isChest(m){return muscleName(m).includes('CHEST')}
function detailProfile(m){const s=muscleName(m);if(s.includes('CHEST'))return{mid:2.35,micro:1.62,fine:1.25,gain:1.14,fibre:15};if(s.includes('SHOULDER')||s.includes('DELT'))return{mid:2.12,micro:1.52,fine:1.20,gain:1.12,fibre:13};if(s.includes('ABS')||s.includes('RECTUS'))return{mid:2.18,micro:1.55,fine:1.18,gain:1.13,fibre:10};if(s.includes('QUAD'))return{mid:2.18,micro:1.55,fine:1.18,gain:1.12,fibre:12};if(s.includes('BICEP')||s.includes('TRICEP'))return{mid:1.95,micro:1.42,fine:1.14,gain:1.10,fibre:10};if(s.includes('CALF'))return{mid:1.88,micro:1.38,fine:1.12,gain:1.09,fibre:9};return{mid:1.72,micro:1.28,fine:1.05,gain:1.05,fibre:7}}
function hashNoise(x,y){const q=Math.sin(x*12.9898+y*78.233)*43758.5453;return (q-Math.floor(q))-.5}
function fibreSignal(m,mirrored,gx,gy,bb){const s=muscleName(m);let u=(gx-bb.x)/Math.max(1,bb.width),v=(gy-bb.y)/Math.max(1,bb.height);u=Math.max(0,Math.min(1,u));v=Math.max(0,Math.min(1,v));if(mirrored)u=1-u;let phase=0,amp=1;
  if(s.includes('CHEST')){const fan=(u-.08);phase=(v*15.2)+(fan*fan*4.8)+(Math.sin(u*Math.PI)*1.3);amp=.95;}
  else if(s.includes('SHOULDER')||s.includes('DELT')){const dx=u-.52,dy=v-.05;phase=Math.sqrt(dx*dx*1.4+dy*dy)*19.0 + Math.atan2(dy,dx)*1.7;amp=.78;}
  else if(s.includes('ABS')||s.includes('RECTUS')){phase=u*11.5 + Math.sin(v*Math.PI*1.1)*1.6 + v*1.2;amp=.58;}
  else if(s.includes('QUAD')){phase=u*13.2 + Math.sin(v*Math.PI)*2.4 + v*.8;amp=.78;}
  else if(s.includes('BICEP')||s.includes('TRICEP')){phase=u*11.8 + Math.sin(v*Math.PI)*2.2;amp=.68;}
  else if(s.includes('CALF')){phase=u*12.5 + Math.sin(v*Math.PI*1.25)*2.0;amp=.64;}
  else{phase=u*10.5 + Math.sin(v*Math.PI)*1.55;amp=.46;}
  const broad=Math.sin(phase*Math.PI*2)*.62 + Math.sin((phase*2.08+u*.9)*Math.PI*2)*.24;
  const irregular=hashNoise(Math.floor(gx*.38),Math.floor(gy*.38))*.24 + hashNoise(Math.floor(gx*.16+7),Math.floor(gy*.16+13))*.20;
  return (broad+irregular)*amp;
}`
    );
    rep(
      'const out=new ImageData(M.mw,M.mh),chest=isChest(m)&&goldOn;',
      'const out=new ImageData(M.mw,M.mh),chest=isChest(m)&&goldOn,profile=detailProfile(m);'
    );
    rep(
      'let tex=mid*1.45+micro*1.10+fine*.95;tex=Math.max(-34,Math.min(34,tex));lum+=tex*textureGate',
      `let tex=mid*profile.mid+micro*profile.micro+fine*profile.fine;if(tex<0)tex*=1.10;tex=Math.max(-44,Math.min(44,tex));lum+=tex*textureGate*profile.gain;
      if(fibreOn){const fib=fibreSignal(m,mirrored,gx,gy,bb);const fibreGate=smoothstep(.16,.52,n);const centreSoft=.72+.28*Math.sin(Math.min(1,n)*Math.PI/2);lum+=fib*profile.fibre*fibreGate*centreSoft}`
    );
    rep(
      'Mid detail: blur1.5 − blur13\\nMicro detail: blur1.5 − blur6\\nFine detail: original − blur1.5\\nBoundary protection: ON\\nManual muscle fitting: none',
      'Geometry: V7/V8 locked\\nSource detail: multi-band\\nFibre flow: curved by muscle group\\nChest: fan pattern\\nDelts: radial arc\\nAbs/quads: curved longitudinal flow\\nMicro variation: irregular\\nBoundary protection: ON'
    );
    rep(
      "document.getElementById('detailBtn').onclick=async()=>{detailOn=!detailOn;const b=document.getElementById('detailBtn');b.classList.toggle('active',detailOn);b.textContent=`Detail ${detailOn?'ON':'OFF'}`;await rerender('Updating surface detail…')};",
      "document.getElementById('detailBtn').onclick=async()=>{detailOn=!detailOn;const b=document.getElementById('detailBtn');b.classList.toggle('active',detailOn);b.textContent=`Detail ${detailOn?'ON':'OFF'}`;await rerender('Updating source detail…')};document.getElementById('fibreBtn').onclick=async()=>{fibreOn=!fibreOn;const b=document.getElementById('fibreBtn');b.classList.toggle('active',fibreOn);b.textContent=`Fibres ${fibreOn?'ON':'OFF'}`;await rerender('Updating curved fibres…')};"
    );
    rep('V7 detail pass ready ✓','V9 curved fibre pass ready ✓');
    rep('assets/anatomy-detail-front-fit-256.webp?v=11','assets/anatomy-detail-front-fit-256.webp?v=13');

    document.open();
    document.write(h);
    document.close();
  }catch(e){
    document.body.innerHTML='<div class="loading"><div><b>V9 failed to load</b><span>'+String(e.message||e)+'</span></div></div>';
  }
})();
</script>
</body>
</html>
