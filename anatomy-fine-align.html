<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Project Athlete — Fine Alignment</title>
<style>
:root{color-scheme:dark;--bg:#07090c;--panel:#11151b;--line:#292f38;--text:#f2efe8;--muted:#9aa1aa;--gold:#d7b75d}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{padding:calc(12px + env(safe-area-inset-top)) 12px calc(22px + env(safe-area-inset-bottom))}
.wrap{max-width:540px;margin:auto}
h1{font-size:21px;margin:0 0 5px}
.sub{font-size:12px;line-height:1.4;color:var(--muted);margin:0 0 10px}
.stage{position:relative;width:100%;aspect-ratio:2/3;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:#d9d9d9}
.stage>*{position:absolute;inset:0;width:100%;height:100%}
#detailWrap{z-index:2;transform-origin:center}
#detail{width:100%;height:100%;object-fit:contain;display:block;mix-blend-mode:luminosity}
#gold{z-index:3}
#reference{z-index:4;width:100%;height:100%;object-fit:contain;filter:grayscale(1) sepia(1) saturate(9) hue-rotate(135deg) brightness(1.2) contrast(1.35);mix-blend-mode:screen;pointer-events:none}
.panel{margin-top:10px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.control{margin-top:10px}
.control:first-child{margin-top:0}
label{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:#bcc2c9;margin-bottom:5px}
.value{color:var(--gold);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--gold)}
button{border:1px solid #3a414c;background:#181d24;color:var(--text);border-radius:11px;padding:10px;font-weight:700}
button.active{border-color:#7d6933;background:#211c10;color:#ead17a}
.readout{margin-top:10px;padding:9px 10px;border-radius:10px;background:#0b0e12;border:1px solid #222831;font:12px ui-monospace,SFMono-Regular,Menlo,monospace;color:#c8cdd3;word-break:break-word}
.note{font-size:11px;color:#7f8790;line-height:1.4;margin-top:8px}
</style>
</head>
<body>
<div class="wrap">

<div class="panel">
  <div class="grid">
    <button id="refBtn" class="active">Reference ON</button>
    <button id="goldBtn" class="active">Gold ON</button>
  </div>

  <div class="control">
    <label><span>X position</span><span id="xv" class="value">0 px</span></label>
    <input id="x" type="range" min="-80" max="80" step="1" value="0">
  </div>
  <div class="control">
    <label><span>Y position</span><span id="yv" class="value">0 px</span></label>
    <input id="y" type="range" min="-80" max="80" step="1" value="0">
  </div>
  <div class="control">
    <label><span>Overall scale</span><span id="sv" class="value">1.000</span></label>
    <input id="scale" type="range" min="0.850" max="1.150" step="0.001" value="1">
  </div>
  <div class="control">
    <label><span>Width</span><span id="wv" class="value">1.000</span></label>
    <input id="width" type="range" min="0.850" max="1.150" step="0.001" value="1">
  </div>
  <div class="control">
    <label><span>Height</span><span id="hv" class="value">1.000</span></label>
    <input id="height" type="range" min="0.850" max="1.150" step="0.001" value="1">
  </div>
  <div class="control">
    <label><span>Detail opacity</span><span id="ov" class="value">70%</span></label>
    <input id="opacity" type="range" min="20" max="100" step="1" value="70">
  </div>
  <div class="control">
    <label><span>Reference opacity</span><span id="rv" class="value">50%</span></label>
    <input id="refOpacity" type="range" min="10" max="90" step="1" value="50">
  </div>

  <div class="grid" style="margin-top:10px">
    <button id="resetBtn">Reset</button>
    <button id="copyBtn">Copy values</button>
  </div>

  <div id="readout" class="readout">x:0 y:0 scale:1.000 width:1.000 height:1.000</div>
  <div class="note">Use the sliders to fine-tune the detailed body against the cyan reference.</div>
</div>

<script type="module">
import { MALE_FRONT } from 'https://esm.sh/@musclemap/assets@1.0.1?bundle';

const NS='http://www.w3.org/2000/svg';
const gold=document.getElementById('gold');
for(const m of MALE_FRONT.muscles){
  if(m.group==='CHEST'||String(m.id||'').startsWith('CHEST_')){
    const p=document.createElementNS(NS,'path');
    p.setAttribute('d',m.d);
    p.setAttribute('fill','#d7b75d');
    p.setAttribute('fill-opacity','.96');
    gold.appendChild(p);
  }
}

const el=id=>document.getElementById(id);
const wrap=el('detailWrap'), detail=el('detail'), ref=el('reference');
const x=el('x'), y=el('y'), scale=el('scale'), width=el('width'), height=el('height'), opacity=el('opacity'), refOpacity=el('refOpacity');

function apply(){
  const xv=+x.value, yv=+y.value, s=+scale.value, sx=+width.value, sy=+height.value;
  wrap.style.transform=`translate(${xv}px,${yv}px) scale(${s*sx},${s*sy})`;
  detail.style.opacity=(+opacity.value/100);
  ref.style.opacity=(+refOpacity.value/100);

  el('xv').textContent=`${xv} px`;
  el('yv').textContent=`${yv} px`;
  el('sv').textContent=s.toFixed(3);
  el('wv').textContent=sx.toFixed(3);
  el('hv').textContent=sy.toFixed(3);
  el('ov').textContent=`${opacity.value}%`;
  el('rv').textContent=`${refOpacity.value}%`;
  el('readout').textContent=`x:${xv} y:${yv} scale:${s.toFixed(3)} width:${sx.toFixed(3)} height:${sy.toFixed(3)}`;
}
[x,y,scale,width,height,opacity,refOpacity].forEach(n=>n.addEventListener('input',apply));

let refOn=true,goldOn=true;
el('refBtn').onclick=()=>{refOn=!refOn;ref.style.display=refOn?'block':'none';el('refBtn').classList.toggle('active',refOn);el('refBtn').textContent=`Reference ${refOn?'ON':'OFF'}`};
el('goldBtn').onclick=()=>{goldOn=!goldOn;gold.style.display=goldOn?'block':'none';el('goldBtn').classList.toggle('active',goldOn);el('goldBtn').textContent=`Gold ${goldOn?'ON':'OFF'}`};
el('resetBtn').onclick=()=>{x.value=0;y.value=0;scale.value=1;width.value=1;height.value=1;opacity.value=70;refOpacity.value=50;apply()};
el('copyBtn').onclick=async()=>{try{await navigator.clipboard.writeText(el('readout').textContent);el('copyBtn').textContent='Copied ✓'}catch{el('copyBtn').textContent='Screenshot values'}};
apply();
</script>
</body>
</html>
